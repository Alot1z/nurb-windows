name: upstream-sync

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Add upstream remote
        shell: pwsh
        run: git remote add upstream https://github.com/Shpigford/nurb.git
      - name: Fetch upstream
        run: git fetch upstream main --prune
      - name: Report upstream delta
        run: python tools/upstream_sync.py status
      - name: Prepare synchronization branch when needed
        id: sync
        shell: pwsh
        run: |
          $behind = [int](git rev-list --count HEAD..upstream/main)
          "behind=$behind" >> $env:GITHUB_OUTPUT
          if ($behind -eq 0) {
            Write-Host 'Upstream is current.'
            exit 0
          }
          $branch = "upstream-sync/$((git rev-parse --short upstream/main))"
          $head_short = (git rev-parse --short HEAD)
          git switch -C $branch
          git merge --no-commit --no-ff upstream/main
          if ($LASTEXITCODE -ne 0) {
            # Conflict path: instead of failing the schedule with a throw
            # (which produces nothing actionable), open a tracking issue
            # pointing at this very run + the conflict-classified paths
            # from the upstream_sync tool, so a maintainer can pick it up.
            git merge --abort
            Write-Host "Upstream merge has conflicts; opening tracking issue."
            $drift = (uv run --project . python tools/upstream_sync.py status 2>$null) `
                     | Select-String -Pattern '^(SAFE|REVIEW|WINDOWS-SPECIFIC):' `
                     | ForEach-Object { $_.ToString().Trim() }
            $body = @"
            Scheduled upstream sync detected an unrecoverable conflict.

            - fork `@ $head_short` is `$behind` commits behind `upstream/main`
            - run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
            - next step: see `docs/windows/PORTING.md` for the merge protocol,
              `docs/windows/UPSTREAM-SYNC.md` for the strict-gate semantics.

            Current drift classification:

            ```
            $(($drift -join "`n"))
            ```
            "@
            gh issue create --title "Upstream sync conflict ($head_short ← upstream/main, $behind commits)" --body $body --label "upstream-sync"
            throw 'See the tracking issue opened above for the merge protocol.'
          }
          git commit -m 'Sync upstream nurb'
          git push --force-with-lease origin $branch
          "branch=$branch" >> $env:GITHUB_OUTPUT
      - name: Open synchronization PR
        if: steps.sync.outputs.behind != '0' && steps.sync.outputs.branch != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create --base main --head "${{ steps.sync.outputs.branch }}" --title "Sync upstream nurb" --body "Automated upstream synchronization. Review Windows-specific paths before merge." 2>$null
