name: upstream-sync

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Add upstream remote
        shell: pwsh
        run: git remote add upstream https://github.com/Shpigford/nurb.git
      - name: Fetch upstream
        run: git fetch upstream main --prune
      - name: Report upstream delta
        run: python tools/upstream_sync.py status
      - name: Prepare synchronization branch when needed
        id: sync
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $behind = [int](git rev-list --count HEAD..upstream/main)
          "behind=$behind" >> $env:GITHUB_OUTPUT
          if ($behind -eq 0) {
            Write-Host 'Upstream is current.'
            exit 0
          }
          $branch = "upstream-sync/$((git rev-parse --short upstream/main))"
          $head_short = (git rev-parse --short HEAD)
          $up_short = (git rev-parse --short upstream/main)
          git switch -C $branch
          git merge --no-commit --no-ff upstream/main
          if ($LASTEXITCODE -ne 0) {
            # Conflict path: open a tracking issue when the repo has issues
            # enabled; otherwise fall back to a persistent conflict-tracker PR
            # carrying UPSTREAM-CONFLICT.md. The run still fails loudly so the
            # scheduled check stays meaningful, and the tracker points here.
            git merge --abort
            Write-Host "Upstream merge has conflicts; opening tracking issue."
            $drift = (uv run --project . python tools/upstream_sync.py status 2>$null) `
                     | Select-String -Pattern '^(SAFE|REVIEW|WINDOWS-SPECIFIC):' `
                     | ForEach-Object { $_.ToString().Trim() }
            $title = "Upstream sync conflict ($head_short <-- upstream/main, $behind commits)"
            # Single-quoted here-string: no backtick escapes, no interpolation,
            # so Markdown backticks stay literal (a double-quoted here-string
            # would read `u in `upstream as an invalid unicode escape). Values
            # are spliced in below with .Replace().
            $body = @'
            Scheduled upstream sync detected an unrecoverable conflict.

            - fork at __HEAD__ is __BEHIND__ commits behind `upstream/main` (__UP__)
            - run: https://github.com/__REPO__/actions/runs/__RUN__
            - next step: see `docs/windows/PORTING-MERGE-CHECKLIST.md` for the merge
              protocol and `docs/windows/UPSTREAM-SYNC.md` for strict-gate semantics.

            Current drift classification:

            ```
            __DRIFT__
            ```
            '@
            $body = $body.Replace('__HEAD__', $head_short).Replace('__BEHIND__', $behind)
            $body = $body.Replace('__UP__', $up_short)
            $body = $body.Replace('__REPO__', "${{ github.repository }}").Replace('__RUN__', "${{ github.run_id }}")
            $body = $body.Replace('__DRIFT__', ($drift -join [Environment]::NewLine))
            gh issue create --title $title --body $body --label "upstream-sync" 2>$null
            if ($LASTEXITCODE -ne 0) {
              # Issues disabled: keep one persistent tracker PR instead.
              Write-Host 'Issues disabled; maintaining the conflict-tracker PR.'
              git switch -C upstream-sync/conflict-tracker
              Set-Content -Path UPSTREAM-CONFLICT.md -Value $body -Encoding utf8
              git add UPSTREAM-CONFLICT.md
              git commit -m "Record upstream sync conflict against $up_short" 2>$null
              git push --force origin upstream-sync/conflict-tracker 2>$null
              $existing = gh pr list --repo ${{ github.repository }} `
                          --head upstream-sync/conflict-tracker --json number `
                          --jq '.[0].number' 2>$null
              if ($existing) {
                gh pr edit $existing --title $title --body $body 2>$null
              } else {
                gh pr create --base main --head upstream-sync/conflict-tracker `
                             --title $title --body $body 2>$null
              }
            }
            throw 'Upstream merge has conflicts; see the tracker opened above.'
          }
          git commit -m 'Sync upstream nurb'
          git push --force-with-lease origin $branch
          "branch=$branch" >> $env:GITHUB_OUTPUT
      - name: Open synchronization PR
        if: steps.sync.outputs.behind != '0' && steps.sync.outputs.branch != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create --base main --head "${{ steps.sync.outputs.branch }}" --title "Sync upstream nurb" --body "Automated upstream synchronization. Review Windows-specific paths before merge." 2>$null
