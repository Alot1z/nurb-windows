name: windows-release

# Builds the signed Windows installer and updater artifacts for a release,
# attaches them to the GitHub release the publish workflow created, and
# uploads the static latest.json that the installed app's updater endpoint
# (`releases/latest/download/latest.json`) serves.
#
# Runs on the vX.Y.Z tag created by the publish workflow on a version bump.
# A tag created by a workflow's own GITHUB_TOKEN does not re-trigger
# tag-push workflows, so a publish that auto-creates the release leaves it
# without Windows artifacts. workflow_dispatch with a tag input is the manual
# completion path (and the rebuild path for a botched release): run it from
# main with tag=vX.Y.Z and it builds from the tag's commit, then attaches the
# installer, .sig, and latest.json to that release.
#
# Requires two repository secrets, one per environment that builds:
#   TAURI_SIGNING_PRIVATE_KEY           the updater private key contents
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  the key's password
# The matching public key is committed (desktop/signing/tauri-updater.key.pub)
# and embedded in the app via tauri.conf.json, so the app can verify the
# signatures these artifacts carry. Never point this at upstream nurb's
# release channel; the endpoint is pinned to Alot1z/nurb-windows.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and attach artifacts to (e.g. v0.21.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      # The build's beforeBuildCommand runs desktop/scripts/stage.py, which
      # needs uv to build the wheel and compile the requirements lock.
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Build signed Windows installer and updater artifacts
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: ${{ inputs.tag || github.ref_name }}
          releaseBody: "See the GitHub release for details."
          releaseDraft: false
          prerelease: false
          # The runner is windows-latest, but say the target out loud so the
          # intended platform is recorded in the workflow.
          args: --target x86_64-pc-windows-msvc
          # Publish the static latest.json to the release; the installed app's
          # updater endpoint is pinned to that file on Alot1z/nurb-windows.
          includeUpdaterJson: true
          updaterJsonPreferNsis: true

      # Verify the artifacts as released, not as built: download the actual
      # installer, .sig, and latest.json from the release and check the
      # minisign signature against the committed updater key with the same
      # decoding semantics the app uses, plus version/url/signature identity.
      # A broken upload fails the workflow instead of shipping to updaters.
      - name: Verify the released artifacts cryptographically
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the release verifier
        shell: bash
        run: |
          python tools/release_verify.py --tag "${{ inputs.tag || github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --out "${{ runner.temp }}/release-provenance.json"
      - name: Upload the provenance record
        uses: actions/upload-artifact@v4
        with:
          name: release-provenance
          path: ${{ runner.temp }}/release-provenance.json
          if-no-files-found: error

  # The release must prove itself before it is trusted: download the actual
  # released installer (never the workspace copy), silent-install it into a
  # scratch dir that deliberately contains a space, verify the version
  # resource and the file layout, then launch the app and require the main
  # process and its WebView2 child to stay alive. This is a smoke test only
  # (install + version + launch + process-alive); the full updater E2E stays
  # manual. A failure here fails the workflow, so a release whose installer
  # cannot install or whose app cannot start never ships.
  smoke:
    needs: windows
    runs-on: windows-latest
    steps:
      - name: Download the released installer
        shell: pwsh
        run: |
          $tag = "${{ inputs.tag || github.ref_name }}"
          $version = $tag.TrimStart('v')
          $url = "https://github.com/${{ github.repository }}/releases/download/$tag/nurb_${version}_x64-setup.exe"
          $dest = Join-Path $env:RUNNER_TEMP "nurb-smoke-setup.exe"
          curl.exe -sL -o $dest $url
          if (-not (Test-Path $dest)) { throw "installer download failed" }
          Write-Host "downloaded $((Get-Item $dest).Length) bytes for $tag"

      - name: Silent-install into a scratch dir with a space
        shell: pwsh
        run: |
          $setup = Join-Path $env:RUNNER_TEMP "nurb-smoke-setup.exe"
          $dir = Join-Path $env:RUNNER_TEMP "nurb smoke test"
          # The whole command line goes in one pair of quotes: cmd strips the
          # outer pair, NSIS requires /D= to be last and unquoted, and the
          # setup path (runner temp) has no spaces. A path with a space is the
          # point of this step, so /D= must stay bare.
          cmd /c "$setup /S /D=$dir"
          if ($LASTEXITCODE -ne 0) { throw "silent install failed with exit $LASTEXITCODE" }
          if (-not (Test-Path (Join-Path $dir "nurb.exe"))) { throw "nurb.exe missing after install" }
          Write-Host "installed to $dir"

      - name: Verify the version resource and file layout
        shell: pwsh
        run: |
          $tag = "${{ inputs.tag || github.ref_name }}"
          $version = $tag.TrimStart('v')
          $dir = Join-Path $env:RUNNER_TEMP "nurb smoke test"
          $vi = (Get-Item (Join-Path $dir "nurb.exe")).VersionInfo
          Write-Host "FileVersion: $($vi.FileVersion) (expected $version)"
          if ($vi.FileVersion -ne $version) { throw "version mismatch: $($vi.FileVersion) != $version" }
          foreach ($f in @("nurb.exe", "uninstall.exe", "uv.exe", "resources")) {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "missing $f in install" }
          }
          Write-Host "layout OK: nurb.exe, uninstall.exe, uv.exe, resources"

      - name: Launch and confirm the app stays alive
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "nurb smoke test"
          Start-Process -FilePath (Join-Path $dir "nurb.exe")
          $deadline = (Get-Date).AddSeconds(90)
          $alive = $false
          while ((Get-Date) -lt $deadline) {
            $procs = Get-Process -Name nurb -ErrorAction SilentlyContinue
            if ($procs -and $procs.Count -gt 0) { $alive = $true; break }
            Start-Sleep -Seconds 5
          }
          if (-not $alive) { throw "nurb.exe never appeared or exited" }
          $main = $procs[0]
          Start-Sleep -Seconds 15
          $main2 = Get-Process -Id $main.Id -ErrorAction SilentlyContinue
          if (-not $main2) { throw "nurb.exe exited after appearing (pid $($main.Id))" }
          $webview = Get-CimInstance Win32_Process | Where-Object {
            $_.Name -eq "msedgewebview2.exe" -and $_.ParentProcessId -eq $main.Id
          }
          if (-not $webview) { throw "WebView2 child process missing for pid $($main.Id)" }
          Write-Host "SMOKE OK: nurb.exe alive (pid $($main.Id)) with WebView2 child"
          Get-Process -Name nurb, msedgewebview2 -ErrorAction SilentlyContinue |
            Where-Object { $_.Id -eq $main.Id -or $_.Id -in $webview.ProcessId } |
            Stop-Process -Force -ErrorAction SilentlyContinue
