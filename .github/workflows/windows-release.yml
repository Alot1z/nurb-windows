name: windows-release

# Builds the signed Windows installer and updater artifacts for a release,
# attaches them to the GitHub release the publish workflow created, and
# uploads the static latest.json that the installed app's updater endpoint
# (`releases/latest/download/latest.json`) serves.
#
# Runs on the vX.Y.Z tag created by the publish workflow on a version bump.
# A tag created by a workflow's own GITHUB_TOKEN does not re-trigger
# tag-push workflows, so a publish that auto-creates the release leaves it
# without Windows artifacts. workflow_dispatch with a tag input is the manual
# completion path (and the rebuild path for a botched release): run it from
# main with tag=vX.Y.Z and it builds from the tag's commit, then attaches the
# installer, .sig, and latest.json to that release.
#
# Requires two repository secrets, one per environment that builds:
#   TAURI_SIGNING_PRIVATE_KEY           the updater private key contents
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  the key's password
# The matching public key is committed (desktop/signing/tauri-updater.key.pub)
# and embedded in the app via tauri.conf.json, so the app can verify the
# signatures these artifacts carry. Never point this at upstream nurb's
# release channel; the endpoint is pinned to Alot1z/nurb-windows.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and attach artifacts to (e.g. v0.21.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      # The build's beforeBuildCommand runs desktop/scripts/stage.py, which
      # needs uv to build the wheel and compile the requirements lock.
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Build signed Windows installer and updater artifacts
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: ${{ inputs.tag || github.ref_name }}
          releaseBody: "See the GitHub release for details."
          releaseDraft: false
          prerelease: false
          # The runner is windows-latest, but say the target out loud so the
          # intended platform is recorded in the workflow.
          args: --target x86_64-pc-windows-msvc
          # Publish the static latest.json to the release; the installed app's
          # updater endpoint is pinned to that file on Alot1z/nurb-windows.
          includeUpdaterJson: true
          updaterJsonPreferNsis: true

      # Verify the artifacts as released, not as built: download the actual
      # installer, .sig, and latest.json from the release and check the
      # minisign signature against the committed updater key with the same
      # decoding semantics the app uses, plus version/url/signature identity.
      # A broken upload fails the workflow instead of shipping to updaters.
      - name: Verify the released artifacts cryptographically
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the release verifier
        shell: bash
        run: |
          python tools/release_verify.py --tag "${{ inputs.tag || github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --out "${{ runner.temp }}/release-provenance.json"
      - name: Upload the provenance record
        uses: actions/upload-artifact@v4
        with:
          name: release-provenance
          path: ${{ runner.temp }}/release-provenance.json
          if-no-files-found: error
